name: Update

# Checks each day for a newer Tabherd release. When there is one, it installs
# and tests the formula pointed at it on macOS and Linux, then commits that
# change. Run it by hand from the Actions tab to check now.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
      sha256: ${{ steps.latest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
      - name: Compare the formula with the latest release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo tleeadams/tabherd --json tagName --jq .tagName)
          if grep -q "/tags/$tag.tar.gz\"" Formula/tabherd.rb; then
            echo "The formula is already at $tag."
            exit 0
          fi
          sha=$(curl -fsSL "https://github.com/tleeadams/tabherd/archive/refs/tags/$tag.tar.gz" | sha256sum | cut -d' ' -f1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

  verify:
    needs: check
    if: needs.check.outputs.tag
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - id: brew
        uses: Homebrew/actions/setup-homebrew@23156a3d9674d7f52f74f1a58979ec4d77847166
      - name: Point the formula at the new release, then install and test it
        env:
          TAG: ${{ needs.check.outputs.tag }}
          SHA256: ${{ needs.check.outputs.sha256 }}
          FORMULA: ${{ steps.brew.outputs.repository-path }}/Formula/tabherd.rb
        run: |
          perl -pi -e 's|^  url ".*"|  url "https://github.com/tleeadams/tabherd/archive/refs/tags/$ENV{TAG}.tar.gz"|; s|^  sha256 ".*"|  sha256 "$ENV{SHA256}"|' "$FORMULA"
          brew install --formula tleeadams/tap/tabherd
          brew test tleeadams/tap/tabherd

  commit:
    needs: [check, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Commit the new release
        env:
          TAG: ${{ needs.check.outputs.tag }}
          SHA256: ${{ needs.check.outputs.sha256 }}
        run: |
          perl -pi -e 's|^  url ".*"|  url "https://github.com/tleeadams/tabherd/archive/refs/tags/$ENV{TAG}.tar.gz"|; s|^  sha256 ".*"|  sha256 "$ENV{SHA256}"|' Formula/tabherd.rb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "tabherd ${TAG#v}"
          git push
